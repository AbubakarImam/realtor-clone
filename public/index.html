      THESIS: A property marketplace reads as a county land-records office, not a
      SaaS template — parcel grids, ink stamps, and ledger rows replace rounded
      cards and hero search bars.
      OWN-WORLD: Cool paper-white/graphite ground, near-black ink type, one
      stamp-red accent (primary actions), registry-blue secondary, semantic seals
      (green/amber/red). IBM Plex Mono for data/labels, IBM Plex Sans for body.

      STORY: A visitor recognizes a system of record, not a listing feed — every
      property is a filed document with a record number, status seal, and parcel
